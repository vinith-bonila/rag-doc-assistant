name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Build sample index
        run: python -m src.ingest --docs data/sample_docs

      - name: Run tests
        # No LLM key in CI: the pipeline runs retrieval-only and the LLM-dependent
        # assertions are guarded, so the suite is green without secrets.
        run: pytest -q
